# Render Blueprint for CyberSafe Backend
# Deploy at: https://dashboard.render.com/blueprints

services:
  - type: web
    name: cybersafe-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # Set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false  # Set to your frontend URL
